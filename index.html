<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AirBridge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #94a3b8;
      border-radius: 4px;
    }

    @media (prefers-color-scheme: dark) {
      ::-webkit-scrollbar-thumb {
        background: #475569;
      }
    }
  </style>
</head>

<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen">

  <div class="max-w-3xl mx-auto p-4 sm:p-6 space-y-6">

    <header class="flex items-center justify-between gap-4">
      <h1 class="text-2xl font-bold flex items-center gap-2">
        <i data-lucide="zap" class="w-6 h-6 text-amber-500"></i> AirBridge
      </h1>
      <div class="flex items-center gap-2">
        <span id="peers" class="text-xs px-2 py-1 rounded-full bg-slate-200 dark:bg-slate-800"></span>
        <span id="status" class="text-xs px-2 py-1 rounded-full bg-slate-200 dark:bg-slate-800">connecting...</span>
      </div>
    </header>

    <div id="setup" class="hidden rounded-lg border border-amber-400 bg-amber-50 dark:bg-amber-950/40 p-4 text-sm">
      Add your Firebase config in <code>index.html</code> (see README) to start syncing.
    </div>

    <section class="rounded-xl bg-white dark:bg-slate-900 shadow p-4 space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="font-semibold flex items-center gap-2"><i data-lucide="clipboard" class="w-4 h-4"></i> Shared
          Clipboard</h2>
        <button id="copy"
          class="text-sm px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center gap-1.5">
          <i data-lucide="copy" class="w-4 h-4"></i> Copy
        </button>
      </div>
      <textarea id="text" rows="7" disabled placeholder="Type or paste here - it syncs to every device."
        class="w-full resize-y rounded-lg bg-slate-50 dark:bg-slate-800 p-3 font-mono text-sm outline-none focus:ring-2 ring-amber-500 disabled:opacity-50"></textarea>
    </section>

    <section class="rounded-xl bg-white dark:bg-slate-900 shadow p-4 space-y-4">
      <h2 class="font-semibold flex items-center gap-2"><i data-lucide="upload-cloud" class="w-4 h-4"></i> Files</h2>

      <label id="drop"
        class="block cursor-pointer rounded-xl border-2 border-dashed border-slate-300 dark:border-slate-700 p-8 text-center hover:border-amber-500 transition-colors">
        <input id="file" type="file" multiple class="hidden" disabled>
        <i data-lucide="file-plus" class="w-8 h-8 mx-auto mb-2 text-slate-400"></i>
        <p class="text-sm text-slate-500">Click or drop files to share</p>
        <p id="route" class="text-xs text-slate-400 mt-1"></p>
      </label>

      <div id="progress" class="hidden h-1.5 rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden">
        <div id="bar" class="h-full bg-amber-500 transition-all" style="width:0"></div>
      </div>

      <ul id="files" class="space-y-2 max-h-80 overflow-y-auto"></ul>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection, addDoc, query, orderBy, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getStorage, ref, uploadBytesResumable, getDownloadURL }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

    // Replace with your own project's config (Firebase console > Project settings > Your apps).
    const firebaseConfig = typeof __firebase_config !== "undefined" ? __firebase_config : {
      apiKey: "AIzaSyBQpw3IvaYRv-VFN7tXfpPufIxB-fYiI_4",
      authDomain: "airbridge-65fcc.firebaseapp.com",
      projectId: "airbridge-65fcc",
      storageBucket: "airbridge-65fcc.firebasestorage.app",
      messagingSenderId: "817669183773",
      appId: "1:817669183773:web:ccee9e59efaf56633c69f4",
      measurementId: "G-7TXTQCS1G3"
    };

    const $ = id => document.getElementById(id);
    const room = location.hash.slice(1) || "default";
    const icons = () => lucide.createIcons();
    icons();

    if (firebaseConfig.apiKey.startsWith("YOUR_")) {
      $("setup").classList.remove("hidden");
      $("status").textContent = "not configured";
      throw new Error("Firebase config missing");
    }

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);
    const clipDoc = doc(db, "rooms", room, "data", "clipboard");
    const filesCol = collection(db, "rooms", room, "files");
    const peersCol = collection(db, "rooms", room, "peers");

    onAuthStateChanged(auth, user => {
      if (!user) return;
      $("status").textContent = "room: " + room;
      $("text").disabled = false;
      $("file").disabled = false;
      watchClipboard();
      watchFiles();
      joinRoom();
    });
    signInAnonymously(auth).catch(e => { $("status").textContent = "auth failed: " + e.code; });

    // --- clipboard ---
    let timer;
    $("text").addEventListener("input", e => {
      const text = e.target.value;
      clearTimeout(timer);
      timer = setTimeout(() => setDoc(clipDoc, { text, at: serverTimestamp() }), 400);
    });

    function watchClipboard() {
      onSnapshot(clipDoc, snap => {
        // Skip our own optimistic echo, and never yank text out from under whoever is typing.
        if (snap.metadata.hasPendingWrites || document.activeElement === $("text")) return;
        const data = snap.data();
        $("text").value = data ? data.text : "";
      });
    }

    $("copy").addEventListener("click", async () => {
      // navigator.clipboard only exists in a secure context, which a plain
      // http:// LAN address is not - fall back to the old select-and-copy.
      if (navigator.clipboard) {
        await navigator.clipboard.writeText($("text").value);
      } else {
        $("text").select();
        document.execCommand("copy");
      }
      $("copy").innerHTML = '<i data-lucide="check" class="w-4 h-4"></i> Copied';
      icons();
      setTimeout(() => {
        $("copy").innerHTML = '<i data-lucide="copy" class="w-4 h-4"></i> Copy';
        icons();
      }, 1500);
    });

    // --- peer-to-peer -------------------------------------------------------
    // Firestore is used only to swap SDP/ICE. Once a DataChannel opens, file
    // bytes go straight between devices and never touch Firebase Storage.
    const peerId = Math.random().toString(36).slice(2, 10);
    const myPeerDoc = doc(peersCol, peerId);
    const conns = new Map();   // peerId -> { pc, ch, pending: [] }
    const incoming = new Map();  // peerId -> partially received file

    const RTC = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
    const CHUNK = 64 * 1024;
    const HIGH_WATER = 4 * 1024 * 1024;
    // ponytail: peers are pruned by heartbeat age, so a device whose clock is
    // off by more than a minute looks permanently stale. Swap for an RTDB
    // onDisconnect handler if that ever actually happens.
    const STALE_MS = 60000;

    const openChannels = () =>
      [...conns.values()].map(c => c.ch).filter(ch => ch && ch.readyState === "open");

    function joinRoom() {
      // WebRTC is gated on a secure context. https:// and http://localhost
      // qualify; a plain http:// LAN address does not, so stay cloud-only there.
      if (!window.RTCPeerConnection) {
        $("route").textContent = "sends via Firebase Storage (direct needs https)";
        return;
      }
      const beat = () => setDoc(myPeerDoc, { at: serverTimestamp() });
      beat();
      setInterval(beat, 20000);
      addEventListener("pagehide", () => deleteDoc(myPeerDoc));

      onSnapshot(peersCol, snap => {
        const live = new Set();
        for (const d of snap.docs) {
          const age = Date.now() - (d.data().at?.toMillis?.() ?? 0);
          if (d.id === peerId || age > STALE_MS) continue;
          live.add(d.id);
          // Lower id always offers, so two peers never offer to each other at once.
          if (!conns.has(d.id) && peerId < d.id) connect(d.id, true);
        }
        for (const id of [...conns.keys()]) if (!live.has(id)) drop(id);
      });

      onSnapshot(collection(myPeerDoc, "signals"), snap => {
        for (const change of snap.docChanges()) {
          if (change.type !== "added") continue;
          handleSignal(change.doc.data()).catch(e => console.warn("signal", e));
          deleteDoc(change.doc.ref);
        }
      });
    }

    const signal = (to, kind, data) =>
      addDoc(collection(doc(peersCol, to), "signals"), { from: peerId, kind, data });

    function connect(otherId, initiator) {
      const pc = new RTCPeerConnection(RTC);
      const state = { pc, ch: null, pending: [] };
      conns.set(otherId, state);

      pc.onicecandidate = e => e.candidate && signal(otherId, "ice", e.candidate.toJSON());
      pc.onconnectionstatechange = () => {
        if (["failed", "closed", "disconnected"].includes(pc.connectionState)) drop(otherId);
        showPeers();
      };

      if (initiator) {
        setupChannel(otherId, pc.createDataChannel("airbridge"));
        (async () => {
          await pc.setLocalDescription(await pc.createOffer());
          signal(otherId, "offer", { type: pc.localDescription.type, sdp: pc.localDescription.sdp });
        })();
      } else {
        pc.ondatachannel = e => setupChannel(otherId, e.channel);
      }
      return state;
    }

    async function handleSignal({ from, kind, data }) {
      const state = conns.get(from) || connect(from, false);
      const pc = state.pc;

      if (kind === "offer" || kind === "answer") {
        await pc.setRemoteDescription(data);
        for (const c of state.pending.splice(0)) await pc.addIceCandidate(c);
        if (kind === "offer") {
          await pc.setLocalDescription(await pc.createAnswer());
          signal(from, "answer", { type: pc.localDescription.type, sdp: pc.localDescription.sdp });
        }
      } else if (kind === "ice") {
        // Candidates routinely arrive before the description they belong to.
        if (pc.remoteDescription) await pc.addIceCandidate(data);
        else state.pending.push(data);
      }
    }

    function setupChannel(otherId, ch) {
      ch.binaryType = "arraybuffer";
      ch.bufferedAmountLowThreshold = HIGH_WATER / 2;
      conns.get(otherId).ch = ch;
      ch.onopen = showPeers;
      ch.onclose = showPeers;
      ch.onmessage = e => receive(otherId, e.data);
    }

    function drop(otherId) {
      conns.get(otherId)?.pc.close();
      conns.delete(otherId);
      incoming.delete(otherId);
      showPeers();
    }

    function showPeers() {
      const n = openChannels().length;
      $("peers").textContent = n ? n + " direct" : "no peers";
      $("peers").className = "text-xs px-2 py-1 rounded-full " + (n
        ? "bg-emerald-100 text-emerald-800 dark:bg-emerald-900 dark:text-emerald-200"
        : "bg-slate-200 dark:bg-slate-800");
      $("route").textContent = n ? "sends direct, device to device" : "sends via Firebase Storage";
    }
    showPeers();

    function receive(from, data) {
      if (typeof data === "string") {
        incoming.set(from, { ...JSON.parse(data), parts: [], got: 0 });
        return;
      }
      const file = incoming.get(from);
      if (!file) return;
      file.parts.push(data);
      file.got += data.byteLength;
      if (file.got < file.size) return;
      incoming.delete(from);
      addDirect(new File(file.parts, file.name));
    }

    async function sendDirect(files) {
      const channels = openChannels();
      for (const file of files) {
        for (const ch of channels) {
          ch.send(JSON.stringify({ name: file.name, size: file.size }));
          for (let sent = 0; sent < file.size; sent += CHUNK) {
            // Without this the send buffer grows unbounded and the channel dies.
            if (ch.bufferedAmount > HIGH_WATER) {
              await new Promise(r => ch.addEventListener("bufferedamountlow", r, { once: true }));
            }
            ch.send(await file.slice(sent, sent + CHUNK).arrayBuffer());
            $("bar").style.width = (sent / file.size * 100) + "%";
          }
        }
        addDirect(file);
      }
    }

    // --- files ---
    const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" };
    const esc = s => String(s).replace(/[&<>"]/g, c => ESC[c]);
    const size = b => b < 1024 ? b + " B"
      : b < 1048576 ? (b / 1024).toFixed(1) + " KB"
        : (b / 1048576).toFixed(1) + " MB";

    let cloudFiles = [], directFiles = [];

    function addDirect(file) {
      directFiles.unshift({
        name: file.name,
        size: file.size,
        url: URL.createObjectURL(file),
        direct: true
      });
      renderFiles();
    }

    function renderFiles() {
      const all = [...directFiles, ...cloudFiles];
      $("files").innerHTML = all.length === 0
        ? '<li class="text-sm text-slate-500 text-center py-4">No files shared yet.</li>'
        : all.map(f => `
        <li class="flex items-center gap-3 rounded-lg bg-slate-50 dark:bg-slate-800 p-3">
          <i data-lucide="${f.direct ? "zap" : "file"}" class="w-5 h-5 shrink-0 ${f.direct ? "text-emerald-500" : "text-slate-400"}"></i>
          <div class="min-w-0 flex-1">
            <p class="truncate text-sm font-medium">${esc(f.name)}</p>
            <p class="text-xs text-slate-500">${size(f.size)}${f.direct ? " &middot; direct" : ""}</p>
          </div>
          <a href="${esc(f.url)}" download="${esc(f.name)}" target="_blank" rel="noopener"
             class="p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700" title="Download">
            <i data-lucide="download" class="w-4 h-4"></i>
          </a>
        </li>`).join("");
      icons();
    }
    renderFiles();

    function watchFiles() {
      onSnapshot(query(filesCol, orderBy("at", "desc")), snap => {
        cloudFiles = snap.docs.map(d => d.data());
        renderFiles();
      });
    }

    async function uploadToCloud(files) {
      for (const file of files) {
        const path = "rooms/" + room + "/" + Date.now() + "-" + file.name;
        const task = uploadBytesResumable(ref(storage, path), file);
        task.on("state_changed", s => {
          $("bar").style.width = (s.bytesTransferred / s.totalBytes * 100) + "%";
        });
        await task;
        await addDoc(filesCol, {
          name: file.name,
          size: file.size,
          url: await getDownloadURL(task.snapshot.ref),
          at: serverTimestamp()
        });
      }
    }

    async function share(files) {
      if (!files.length) return;
      $("progress").classList.remove("hidden");
      try {
        // Direct when anyone is listening, cloud when nobody is - so a device
        // that shows up later still gets the file.
        if (openChannels().length) await sendDirect(files);
        else await uploadToCloud(files);
      } catch (e) {
        $("status").textContent = "send failed: " + (e.code || e.message);
      } finally {
        $("progress").classList.add("hidden");
        $("bar").style.width = "0";
      }
    }

    $("file").addEventListener("change", e => {
      share([...e.target.files]);
      e.target.value = "";
    });

    const drop_ = $("drop");
    const HOVER = ["border-amber-500", "bg-amber-50", "dark:bg-amber-950/20"];
    ["dragenter", "dragover"].forEach(ev => drop_.addEventListener(ev, e => {
      e.preventDefault();
      drop_.classList.add(...HOVER);
    }));
    ["dragleave", "drop"].forEach(ev => drop_.addEventListener(ev, e => {
      e.preventDefault();
      drop_.classList.remove(...HOVER);
    }));
    drop_.addEventListener("drop", e => {
      if (!$("file").disabled) share([...e.dataTransfer.files]);
    });

    addEventListener("hashchange", () => location.reload());
  </script>
</body>

</html>

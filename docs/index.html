<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AirBridge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #94a3b8;
      border-radius: 4px;
    }

    @media (prefers-color-scheme: dark) {
      ::-webkit-scrollbar-thumb {
        background: #475569;
      }
    }
  </style>
</head>

<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen">

  <div class="max-w-3xl mx-auto p-4 sm:p-6 space-y-6">

    <header class="flex items-center justify-between gap-4">
      <h1 class="text-2xl font-bold flex items-center gap-2">
        <i data-lucide="zap" class="w-6 h-6 text-amber-500"></i> AirBridge
      </h1>
      <span id="status" class="text-xs px-2 py-1 rounded-full bg-slate-200 dark:bg-slate-800">connecting...</span>
    </header>

    <section class="rounded-xl bg-white dark:bg-slate-900 shadow p-4 space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="font-semibold flex items-center gap-2"><i data-lucide="clipboard" class="w-4 h-4"></i> Shared
          Clipboard</h2>
        <button id="copy"
          class="text-sm px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center gap-1.5">
          <i data-lucide="copy" class="w-4 h-4"></i> Copy
        </button>
      </div>
      <textarea id="text" rows="7" placeholder="Type or paste here - it syncs to every device."
        class="w-full resize-y rounded-lg bg-slate-50 dark:bg-slate-800 p-3 font-mono text-sm outline-none focus:ring-2 ring-amber-500"></textarea>
    </section>

    <section class="rounded-xl bg-white dark:bg-slate-900 shadow p-4 space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="font-semibold flex items-center gap-2"><i data-lucide="upload-cloud" class="w-4 h-4"></i> Files</h2>
        <button id="clear" class="hidden text-sm px-3 py-1.5 rounded-lg text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/40 flex items-center gap-1.5">
          <i data-lucide="trash-2" class="w-4 h-4"></i> Clear all
        </button>
      </div>

      <label id="drop"
        class="block cursor-pointer rounded-xl border-2 border-dashed border-slate-300 dark:border-slate-700 p-8 text-center hover:border-amber-500 transition-colors">
        <input id="file" type="file" multiple class="hidden">
        <i data-lucide="file-plus" class="w-8 h-8 mx-auto mb-2 text-slate-400"></i>
        <p class="text-sm text-slate-500">Click or drop files to share</p>
        <p id="route" class="text-xs text-slate-400 mt-1">Anyone on this network can pick them up</p>
      </label>

      <div id="progress" class="hidden h-1.5 rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden">
        <div id="bar" class="h-full bg-amber-500 transition-all" style="width:0"></div>
      </div>

      <ul id="files" class="space-y-2 max-h-80 overflow-y-auto"></ul>
    </section>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const icons = () => lucide.createIcons();
    // Lets the server tell our own edits apart from everyone else's.
    const clientId = Math.random().toString(36).slice(2);
    let files = [];

    // --- clipboard ---
    let timer;
    $("text").addEventListener("input", e => {
      const text = e.target.value;
      clearTimeout(timer);
      timer = setTimeout(() => {
        fetch("/text", {
          method: "POST",
          headers: { "X-Client-Id": clientId, "Content-Type": "text/plain" },
          body: text
        }).catch(() => { });
      }, 300);
    });

    $("copy").addEventListener("click", async () => {
      // navigator.clipboard needs a secure context, which a plain http:// LAN
      // address is not - fall back to the old select-and-copy.
      if (navigator.clipboard) {
        await navigator.clipboard.writeText($("text").value);
      } else {
        $("text").select();
        document.execCommand("copy");
      }
      $("copy").innerHTML = '<i data-lucide="check" class="w-4 h-4"></i> Copied';
      icons();
      setTimeout(() => {
        $("copy").innerHTML = '<i data-lucide="copy" class="w-4 h-4"></i> Copy';
        icons();
      }, 1500);
    });

    // --- files ---
    const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" };
    const esc = s => String(s).replace(/[&<>"]/g, c => ESC[c]);
    const size = b => b < 1024 ? b + " B"
      : b < 1048576 ? (b / 1024).toFixed(1) + " KB"
        : (b / 1048576).toFixed(1) + " MB";

    function render() {
      $("files").innerHTML = files.length === 0
        ? '<li class="text-sm text-slate-500 text-center py-4">No files yet.</li>'
        : files.map(f => `
        <li class="flex items-center gap-3 rounded-lg bg-slate-50 dark:bg-slate-800 p-3">
          <i data-lucide="file" class="w-5 h-5 shrink-0 text-slate-400"></i>
          <div class="min-w-0 flex-1">
            <p class="truncate text-sm font-medium">${esc(f.name)}</p>
            <p class="text-xs text-slate-500">${size(f.size)}</p>
          </div>
          <a href="/file/${esc(f.id)}" download="${esc(f.name)}"
             class="p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700" title="Download">
            <i data-lucide="download" class="w-4 h-4"></i>
          </a>
          <button data-del="${esc(f.id)}"
             class="p-2 rounded-lg text-slate-400 hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-950/40" title="Delete for everyone">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        </li>`).join("");
      $("clear").classList.toggle("hidden", files.length === 0);
      icons();
    }

    // One listener on the list instead of one per row, since rows are replaced
    // every time the list changes.
    $("files").addEventListener("click", e => {
      const id = e.target.closest("[data-del]")?.dataset.del;
      if (id) fetch("/file/" + id, { method: "DELETE" }).catch(() => { });
    });

    $("clear").addEventListener("click", () => {
      if (confirm("Delete every shared file? This removes them from all devices."))
        fetch("/files", { method: "DELETE" }).catch(() => { });
    });

    // XHR rather than fetch, because only XHR reports upload progress.
    const send = file => new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open("POST", "/upload?name=" + encodeURIComponent(file.name));
      xhr.upload.onprogress = e => {
        if (e.lengthComputable) $("bar").style.width = (e.loaded / e.total * 100) + "%";
      };
      xhr.onload = () => {
        if (xhr.status === 200) return resolve();
        // Cloudflare caps request bodies at 100MB; the LAN address has no such cap.
        if (xhr.status === 413) {
          return reject(new Error("Too big for this address (100MB limit). Use the Wi-Fi address instead."));
        }
        reject(new Error("HTTP " + xhr.status));
      };
      xhr.onerror = () => reject(new Error("network error"));
      xhr.onabort = () => reject(new Error("upload was cancelled"));
      // A file the picker handed over can already be unreadable - a cloud
      // placeholder, or a handle the OS revoked. send() throws rather than
      // firing onerror, which otherwise looks like nothing happening at all.
      try {
        xhr.send(file);
      } catch (err) {
        reject(new Error("could not read this file (" + err.message + ")"));
      }
    });

    // No devtools on a phone, so anything thrown has to surface on the page.
    addEventListener("error", e => warn("Error: " + e.message));
    addEventListener("unhandledrejection", e => warn("Error: " + ((e.reason && e.reason.message) || e.reason)));

    async function share(chosen) {
      if (!chosen.length) return warn("The picker returned no files.");
      note("Picked " + chosen.length + " file" + (chosen.length === 1 ? "" : "s") + "...");
      $("progress").classList.remove("hidden");
      const failed = [];

      // Each file stands alone: one failure must not cancel the rest of the batch.
      for (let i = 0; i < chosen.length; i++) {
        if (chosen.length > 1) $("route").textContent = "Sending " + (i + 1) + " of " + chosen.length + "...";
        try {
          await send(chosen[i]);
        } catch (e) {
          failed.push(chosen[i].name + " - " + e.message);
        }
        $("bar").style.width = "0";
      }

      $("progress").classList.add("hidden");
      if (failed.length) warn(failed.join("; "));
      else showRoute();
    }

    let warnTimer;
    function warn(message) {
      note(message);
      $("route").classList.add("text-red-500");
    }

    function note(message) {
      $("route").textContent = message;
      $("route").classList.remove("text-red-500");
      clearTimeout(warnTimer);
      warnTimer = setTimeout(showRoute, 8000);
    }

    function showRoute() {
      $("route").textContent = "Anyone on this network can pick them up";
      $("route").classList.remove("text-red-500");
    }

    $("file").addEventListener("change", async e => {
      // Clearing the input revokes the file handles on some Android browsers,
      // so hold off until every upload has actually read its file.
      const chosen = [...e.target.files];
      await share(chosen);
      e.target.value = "";
    });

    const drop = $("drop");
    const HOVER = ["border-amber-500", "bg-amber-50", "dark:bg-amber-950/20"];
    ["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => {
      e.preventDefault();
      drop.classList.add(...HOVER);
    }));
    ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => {
      e.preventDefault();
      drop.classList.remove(...HOVER);
    }));
    drop.addEventListener("drop", e => share([...e.dataTransfer.files]));

    // --- live updates ---
    function listen() {
      const es = new EventSource("/events");

      es.addEventListener("sync", e => {
        const s = JSON.parse(e.data);
        if (document.activeElement !== $("text")) $("text").value = s.text;
        files = s.files;
        render();
        devices(s.devices);
      });

      es.addEventListener("text", e => {
        const s = JSON.parse(e.data);
        // Skip our own echo, and never overwrite what someone is mid-sentence on.
        if (s.from === clientId || document.activeElement === $("text")) return;
        $("text").value = s.text;
      });

      es.addEventListener("files", e => {
        files = JSON.parse(e.data);
        render();
      });

      es.addEventListener("devices", e => devices(JSON.parse(e.data).devices));

      es.onerror = () => {
        $("status").textContent = "reconnecting...";
        $("status").className = "text-xs px-2 py-1 rounded-full bg-amber-100 text-amber-800 dark:bg-amber-900 dark:text-amber-200";
      };
    }

    function devices(n) {
      $("status").textContent = n + (n === 1 ? " device" : " devices");
      $("status").className = "text-xs px-2 py-1 rounded-full bg-emerald-100 text-emerald-800 dark:bg-emerald-900 dark:text-emerald-200";
    }

    icons();
    render();
    listen();
  </script>
</body>

</html>
